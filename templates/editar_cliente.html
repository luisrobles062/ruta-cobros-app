<!-- templates/editar.html -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Cliente</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
  <h3>Editar Cliente</h3>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" name="nombre" value="{{cliente[1]}}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Monto Prestado</label>
      <input type="number" step="0.01" class="form-control" name="monto_prestado" value="{{cliente[2]}}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Deuda Actual</label>
      <input type="number" step="0.01" class="form-control" name="deuda_actual" value="{{cliente[3]}}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Observaciones</label>
      <textarea class="form-control" name="observaciones">{{cliente[4]}}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
