<!-- templates/gastos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
  <h3>Gastos</h3>
  <form method="POST" class="mb-3">
    <div class="row g-2">
      <div class="col-md-4"><input type="text" class="form-control" name="concepto" placeholder="Concepto" required></div>
      <div class="col-md-3"><input type="number" step="0.01" class="form-control" name="monto" placeholder="Monto" required></div>
      <div class="col-md-3"><input type="text" class="form-control" name="nota" placeholder="Nota"></div>
      <div class="col-md-2"><button class="btn btn-success w-100">Registrar</button></div>
    </div>
  </form>
  <table class="table table-striped">
    <thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Nota</th></tr></thead>
    <tbody>
      {% for g in filas %}
      <tr>
        <td>{{g[3]}}</td>
        <td>{{g[1]}}</td>
        <td>{{money(g[2])}}</td>
        <td>{{g[4]}}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
